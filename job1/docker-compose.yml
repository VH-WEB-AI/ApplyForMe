version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: applyforme-postgres
    environment:
      POSTGRES_USER: applyforme
      POSTGRES_PASSWORD: applyforme
      POSTGRES_DB: applyforme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyforme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: applyforme-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: applyforme-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - resume_uploads:/data/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build: .
    container_name: applyforme-celery-worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - resume_uploads:/data/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info

  flower:
    build: .
    container_name: applyforme-flower
    env_file: .env
    depends_on:
      - redis
      - celery_worker
    ports:
      - "5555:5555"
    command: celery -A app.workers.celery_app flower --port=5555

volumes:
  pgdata:
  resume_uploads:
