services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: applyforme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: applyforme
      POSTGRES_PASSWORD: applyforme
      POSTGRES_DB: applyforme
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyforme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: applyforme-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: applyforme-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://applyforme:applyforme@postgres:5432/applyforme
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5059:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
